<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found &middot; Just Pure Spice</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/assets/css/fonts.css">
  <style>
    :root {
      color-scheme: light;
      --ivory: #f4efe2;
      --ivory-light: #fbf8f1;
      --ink: #1b1712;
      --ink-soft: #4a4035;
      --line: #d8cbb2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 32px 24px;
      background: var(--ivory);
      color: var(--ink);
      font-family: 'EB Garamond', Georgia, 'Times New Roman', serif;
      font-size: 20px;
      line-height: 1.65;
      text-align: center;
    }
    main {
      width: 100%;
      max-width: 640px;
      padding: clamp(28px, 6vw, 64px);
      background: var(--ivory-light);
      border: 1px solid var(--line);
    }
    .brand {
      margin: 0;
      font-size: 12px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }
    .code {
      margin: 32px 0 12px;
      color: var(--ink-soft);
      font-size: 16px;
      letter-spacing: 0.18em;
    }
    h1 {
      margin: 0;
      font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
      font-size: clamp(36px, 6vw, 54px);
      font-weight: 600;
      line-height: 1.1;
    }
    .description { margin: 20px 0 24px; color: var(--ink-soft); }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 10px 16px;
      color: var(--ink);
      text-underline-offset: 0.2em;
      border: 1px solid var(--line);
    }
    a:hover { background: var(--ivory); }
    a:focus-visible { outline: 2px solid var(--ink); outline-offset: 5px; }
  </style>
</head>
<body>
  <main>
    <p class="brand">Just Pure Spice</p>
    <p class="code">404</p>
    <h1>Page not found.</h1>
    <p class="description">The page you requested isn't here.</p>
    <a href="https://jpspice.com/">Return to Just Pure Spice</a>
  </main>
</body>
</html>
